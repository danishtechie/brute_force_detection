version: "3.9"

services:
  # ── BruteGuard App ───────────────────────────────────────────────────
  bruteguard:
    build: .
    container_name: bruteguard-app
    ports:
      - "8000:8000"
    environment:
      # Override config values via env vars (BG__ prefix)
      BG_DATABASE__TYPE: sqlite
      BG_APP__ENVIRONMENT: production
      BG_COLLECTION__MODE: simulation
    volumes:
      - bruteguard-data:/app/data
      - ./config/config.yaml:/app/config/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - soc-net

  # ── Nginx reverse proxy (optional) ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bruteguard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      bruteguard:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - soc-net
    profiles: ["production"]  # Only in production profile

volumes:
  bruteguard-data:

networks:
  soc-net:
    driver: bridge
